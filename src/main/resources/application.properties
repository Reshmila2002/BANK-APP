# Application
spring.application.name=bank-transfer-app
server.port=8081

# MySQL - Your working XAMPP server on port 3307
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/bank_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Database / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Transaction logging
logging.level.org.springframework.transaction.interceptor=TRACE
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG

# Assignment fee extension
# Keep false while running the lecturer's baseline tests.
# Change to true when testing the additional 1% fee requirement.
bank.transfer.fee-enabled=false
bank.transfer.fee-account=999999